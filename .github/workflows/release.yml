name: release

# 发版入口：push vX.Y.Z tag → 校验版本一致 → 跑检查 → npm publish
# 用 npm 可信发布（OIDC），不需要 NPM_TOKEN 之类的长效密钥。
# 前置条件（一次性，在 npmjs.com 上配）：package Settings → Trusted publishing
#   加一条 GitHub Actions：owner=ai12top、repo=pi-provider-allowlist、workflow=release.yml
#   且必须勾选允许直接 npm publish（2026-09-03 之后新建的配置默认只允许 npm stage publish）
# 详见 docs/canon/release-flow.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC 必需；缺了会退化成 ENEEDAUTH

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # 发布构建不吃缓存
      # 刻意不设 registry-url：setup-node 一旦设置就会往 .npmrc 写
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，OIDC 场景下它展开成空串，
      # npm 会以为"凭证已配置"而跳过 OIDC 交换，报 ENEEDAUTH / E404。
      # 见 actions/setup-node#1551、npm/documentation#1960。
      - name: 清掉 .npmrc 里可能存在的空 _authToken（防御 setup-node 的已知坑）
        run: |
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "${RUNNER_TEMP:-/tmp}/.npmrc"; do
            [ -f "$f" ] && sed -i '/_authToken/d' "$f" || true
          done
      - name: 确保 npm 支持可信发布（>= 11.5.1）
        run: |
          cur=$(npm -v); echo "npm $cur / node $(node -v)"
          if [ "$(printf '%s\n' 11.5.1 "$cur" | sort -V | head -1)" != "11.5.1" ]; then
            npm install -g npm@^11.15.0
            echo "升级后 npm $(npm -v)"
          fi
      - name: 校验 tag 与版本一致、且版本未被占用
        run: bash scripts/verify-release-tag.sh
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test
      - name: 发布到 npm
        run: npm publish
      - name: 发布后回查 registry（证明真的上架了）
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for _ in 1 2 3 4 5; do
            got=$(npm view "$name@$version" dist.shasum 2>/dev/null || true)
            if [ -n "$got" ]; then
              echo "✓ $name@$version 已上架，dist.shasum=$got"
              exit 0
            fi
            sleep 5
          done
          echo "✗ 发布后 25s 仍未在 registry 查到 $name@$version" >&2
          exit 1